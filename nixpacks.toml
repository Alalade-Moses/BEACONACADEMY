[phases.setup]
nixPkgs = ["nodejs_18", "npm-9_x"]

[phases.install]
cmds = ["npm ci --legacy-peer-deps || npm install --no-audit --no-fund --legacy-peer-deps"]

[phases.build]
cmds = ["node -e \"console.log('Railway server build ready')\""]

[start]
cmd = "node server/index.js"

[variables]
PORT = "5000"
NODE_ENV = "production"
